# EMC controller parameters for a simulated machine.

# General note: Comments can either be preceded with a # or ; - either is
# acceptable, although # is in keeping with most linux config files.

# General section -------------------------------------------------------------
[EMC]

# Version of this INI file
VERSION = 1.1
MACHINE = Benchman XT

# Debug level, 0 means no messages. See src/emc/nml_int/emcglb.h for others
#DEBUG = 0x7FFFFFFF
DEBUG = 0

# Sections for display options ------------------------------------------------
[DISPLAY]

# Name of display program, e.g., axis
DISPLAY = axis

# Cycle time, in seconds, that display will sleep between polls
CYCLE_TIME = 0.100

# Path to help file
HELP_FILE = doc/help.txt

# Initial display setting for position, RELATIVE or MACHINE
POSITION_OFFSET = RELATIVE

# Initial display setting for position, COMMANDED or ACTUAL
POSITION_FEEDBACK = ACTUAL

# Highest value that will be allowed for feed override, 1.0 = 100%
MAX_FEED_OVERRIDE = 2.0
MAX_SPINDLE_OVERRIDE = 2.0

MAX_LINEAR_VELOCITY = 2.0
DEFAULT_LINEAR_VELOCITY = 0.25
DEFAULT_SPINDLE_SPEED = 3000
# Prefix to be used
PROGRAM_PREFIX = /home/cnc/linuxcnc/nc_files

# Introductory graphic
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 5

EDITOR = geany
TOOL_EDITOR = tooledit

INCREMENTS = 1 in, 0.1 in, 0.01 in, 0.001 in, 0.0001 in

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Grayscale Depth Image
PROGRAM_EXTENSION = .py Python Script

png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python3

# Task controller section -----------------------------------------------------
[TASK]

# Name of task controller program, e.g., milltask
TASK = milltask

# Cycle time, in seconds, that task controller will sleep between polls
CYCLE_TIME = 0.01

# Part program interpreter section --------------------------------------------
[RS274NGC]

# File containing interpreter variables
PARAMETER_FILE = sim.var

# Motion control section ------------------------------------------------------
[EMCMOT]

EMCMOT = motmod

# (cia402_homecomp.comp is tabled for now -- drive-native homing repeated the
# seek/backoff cycle many times regardless of what we tuned on the LinuxCNC side,
# suggesting it's inherent to how this drive's firmware handles the standard CiA402
# controlword bit-4 homing trigger. Using stock homing.c instead, below, via the
# documented cia402.comp index-pulse trick. The file is left in the repo in case
# it's worth revisiting later.)

# Timeout for comm to emcmot, in seconds
COMM_TIMEOUT = 1.0

# BASE_PERIOD is unused in this configuration but specified in core_sim.hal
BASE_PERIOD = 0
# Servo task period, in nano-seconds
SERVO_PERIOD = 1000000

# section for main IO controller parameters -----------------------------------
[EMCIO]

# Name of IO controller program, e.g., io
EMCIO = io

# cycle time, in seconds
CYCLE_TIME = 0.100

# tool table file
TOOL_TABLE = sim.tbl
TOOL_CHANGE_POSITION = 0 0 0
TOOL_CHANGE_QUILL_UP = 1

# Hardware Abstraction Layer section --------------------------------------------------
[HAL]

# The run script first uses halcmd to execute any HALFILE
# files, and then to execute any individual HALCMD commands.
#

# list of hal config files to run through halcmd
# files are executed in the order in which they appear
HALFILE = benchman.hal

# list of halcmd commands to execute
# commands are executed in the order in which they appear
#HALCMD = save neta

# Single file that is executed after the GUI has started.  Only supported by
# AXIS at this time (only AXIS creates a HAL component of its own)
#POSTGUI_HALFILE = test_postgui.hal

HALUI = halui

# Trajectory planner section --------------------------------------------------
[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 0.1
MAX_LINEAR_VELOCITY = 1.0
#DEFAULT_LINEAR_ACCELERATION = 1
#MAX_LINEAR_ACCELERATION = 100

# The absolute encoders keep the true position across ordinary power cycles, so
# LinuxCNC doesn't need a fresh homing confirmation every session -- trust whatever
# position the drives report at boot. The rare index-pulse homing trigger below is
# only for re-referencing after a battery swap or an axis coming apart.
NO_FORCE_HOMING = 1

[KINS]
KINEMATICS = trivkins
JOINTS = 3

# Axes sections ---------------
[AXIS_X]
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 3.0
MIN_LIMIT = 0.0
MAX_LIMIT = 10.0

[AXIS_Y]
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 3.0
# Y homes to its positive-limit switch, which is machine coordinate 0 -- travel is
# entirely negative from there. -5.0 is a conservative guess pending measuring the
# real travel; tighten/loosen once actual travel is confirmed.
MIN_LIMIT = -5.0
MAX_LIMIT = 0.0

[AXIS_Z]
MAX_VELOCITY = 1.0
MAX_ACCELERATION = 3.0
MIN_LIMIT = -8.0
MAX_LIMIT = 0.12

# Joints sections -------------
[JOINT_0]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 1.333
MAX_ACCELERATION = 3.0
BACKLASH = 0.000
FERROR = 0.100
MIN_FERROR = 0.010
# X homes to its negative-limit switch, which is machine coordinate 0 (matches
# AXIS_X's MIN_LIMIT) -- travel is entirely positive from there, so MIN_LIMIT can't
# be negative without allowing motion past the switch it just homed against.
MIN_LIMIT = 0.0
MAX_LIMIT = 10.0
# HOME_OFFSET must match CIA402_HOME_OFFSET_COUNTS / 655360 (pos-scale) below --
# stock homing.c sets the joint's position to HOME_OFFSET at the moment index-enable
# clears, so this needs to agree with what the drive itself reports at that instant
# or LinuxCNC would layer a second, conflicting offset on top of the drive's own.
HOME_OFFSET = 0.0
# Required by cia402.comp's index-pulse trick: search vel 0 means homing.c issues no
# motion of its own, it just waits for index-enable to clear; latch vel must be
# nonzero (arbitrary placeholder) or homing.c's internal math is unhappy, but the
# real speed is entirely determined by the drive's own homing-*-velocity settings.
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.2
HOME_USE_INDEX = YES
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1
HOME_IS_SHARED = 1

# Drive-side homing config (still needed regardless of trigger mechanism -- the drive's
# own 6098h/6099h/609Ah/607Ch objects, pushed in via benchman.hal). Trigger is now
# joint.0.index-enable <-> cia402.0.home (wired in benchman.hal), fired by LinuxCNC's
# own stock index-pulse homing path: `halcmd setp halui.joint.0.home 1` or the AXIS
# Home button. Harmless day-to-day since NO_FORCE_HOMING means it's never required --
# only use it after a battery swap or reassembling this axis.
# Homes to the negative-limit switch, no Z-pulse search: method 17. Method 1 (Z-pulse
# search) never reported completion on this drive/absolute-encoder combo -- statusword
# bits 12/15 stayed 0 through several internal retries with fault-code staying 0 the
# whole time, so the drive was silently giving up rather than faulting or finishing.
# CIA402_HOME_OFFSET_COUNTS is the raw encoder count (607C) the drive reports once homing is complete
CIA402_HOMING_METHOD = 17
# Bumped from 50000: at that speed a full 20" search could take well over a minute,
# likely exceeding the drive's internal homing time limit (2010.09h) -- see the
# repeating seek/backoff loop this caused. 300000 counts/s is ~27.5 in/min, still
# well under MAX_VELOCITY (80 in/min).
CIA402_HOMING_SEARCH_VELOCITY = 200000
CIA402_HOMING_LATCH_VELOCITY = 20000
# Bumped from 100000: at that rate, decelerating from the 300000 search speed took
# ~3s and ~0.69" of overshoot past the switch, forcing the drive to repeatedly
# re-touch/re-latch to converge (17 cycles, ~40s total). 700000 cuts the overshoot
# to roughly 0.1" (~1.07 in/s^2, comparable to normal MAX_ACCELERATION elsewhere).
CIA402_HOMING_ACCELERATION = 100000
CIA402_HOME_OFFSET_COUNTS = 0

[JOINT_1]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 1.333
MAX_ACCELERATION = 3.0
BACKLASH = 0.000
FERROR = 0.100
MIN_FERROR = 0.010
MIN_LIMIT = -5.0
MAX_LIMIT = 0.0
# Y homes to the positive-limit switch, and that switch is machine coordinate 0 --
# matches HOME (0.000) below, so no post-homing park move is needed. Must match
# CIA402_HOME_OFFSET_COUNTS / 655360 -- see the note on [JOINT_0].
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.2
HOME_USE_INDEX = YES
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1

# Method 18 (positive limit, no Z-pulse) -- see the note on [JOINT_0] about why
# Z-pulse-search methods (was 2) aren't completing reliably on this drive.
CIA402_HOMING_METHOD = 18
CIA402_HOMING_SEARCH_VELOCITY = 100000
CIA402_HOMING_LATCH_VELOCITY = 20000
CIA402_HOMING_ACCELERATION = 300000
CIA402_HOME_OFFSET_COUNTS = 0

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 1.333
MAX_ACCELERATION = 1.0
BACKLASH = 0.000
MIN_LIMIT = -8.0

# Normally the Z max should be 0.000!
# The only reason it's greater than 0 here is so that the splash screen
# gcode will run.
MAX_LIMIT = 0.12

FERROR = 0.050
MIN_FERROR = 0.010
# Was 1.0 (stale, pre-dated this setup) -- must match CIA402_HOME_OFFSET_COUNTS / 655360
# below. Z homes to its positive-limit switch at 0 counts = 0.0", true top-of-travel.
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.2
HOME_USE_INDEX = YES
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 0
HOME_IS_SHARED = 1

# Z homes to its positive-limit switch (fully retracted/up), method 18, no Z-pulse
# (this was drifted to 2, a Z-pulse method -- see the note on [JOINT_0]).
# Home offset is 0 counts so machine Z0 is true top-of-travel (see MAX_LIMIT note above).
CIA402_HOMING_METHOD = 18
CIA402_HOMING_SEARCH_VELOCITY = 2000000
CIA402_HOMING_LATCH_VELOCITY = 1000000
CIA402_HOMING_ACCELERATION = 6000000
CIA402_HOME_OFFSET_COUNTS = 0

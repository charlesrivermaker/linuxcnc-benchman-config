# EMC controller parameters for a simulated machine.

# General note: Comments can either be preceded with a # or ; - either is
# acceptable, although # is in keeping with most linux config files.

# General section -------------------------------------------------------------
[EMC]

# Version of this INI file
VERSION = 1.1
MACHINE = Benchman XT

# Debug level, 0 means no messages. See src/emc/nml_int/emcglb.h for others
#DEBUG = 0x7FFFFFFF
DEBUG = 0

# Sections for display options ------------------------------------------------
[DISPLAY]

# Name of display program, e.g., axis
DISPLAY = axis

# Cycle time, in seconds, that display will sleep between polls
CYCLE_TIME = 0.100

# Path to help file
HELP_FILE = doc/help.txt

# Initial display setting for position, RELATIVE or MACHINE
POSITION_OFFSET = RELATIVE

# Initial display setting for position, COMMANDED or ACTUAL
POSITION_FEEDBACK = ACTUAL

# Highest value that will be allowed for feed override, 1.0 = 100%
MAX_FEED_OVERRIDE = 2.0
MAX_SPINDLE_OVERRIDE = 2.0

MAX_LINEAR_VELOCITY = 3.0
DEFAULT_LINEAR_VELOCITY = 0.25
DEFAULT_SPINDLE_SPEED = 3000
# Prefix to be used
PROGRAM_PREFIX = /home/cnc/linuxcnc/nc_files

# Introductory graphic
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 5

EDITOR = geany
TOOL_EDITOR = tooledit

INCREMENTS = 1 in, 0.1 in, 0.01 in, 0.001 in, 0.0001 in

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Grayscale Depth Image
PROGRAM_EXTENSION = .py Python Script

png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python3

# Task controller section -----------------------------------------------------
[TASK]

# Name of task controller program, e.g., milltask
TASK = milltask

# Cycle time, in seconds, that task controller will sleep between polls
CYCLE_TIME = 0.01

# Part program interpreter section --------------------------------------------
[RS274NGC]

# File containing interpreter variables
PARAMETER_FILE = sim.var

# Motion control section ------------------------------------------------------
[EMCMOT]

EMCMOT = motmod
HOMEMOD = el7_homecomp

# Timeout for comm to emcmot, in seconds
COMM_TIMEOUT = 1.0

# BASE_PERIOD is unused in this configuration but specified in core_sim.hal
BASE_PERIOD = 0
# Servo task period, in nano-seconds
SERVO_PERIOD = 1000000

# section for main IO controller parameters -----------------------------------
[EMCIO]

# Name of IO controller program, e.g., io
EMCIO = io

# cycle time, in seconds
CYCLE_TIME = 0.200

# tool table file
TOOL_TABLE = sim.tbl
TOOL_CHANGE_POSITION = 0 0 0
TOOL_CHANGE_QUILL_UP = 1

# Hardware Abstraction Layer section --------------------------------------------------
[HAL]

TWOPASS = true
HALFILE = benchman.hal
HALUI = halui

# Trajectory planner section --------------------------------------------------
[TRAJ]
HOME = 0 0 0
COORDINATES = X Y Z
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 0.1
MAX_LINEAR_VELOCITY = 3.0
#DEFAULT_LINEAR_ACCELERATION = 1
#MAX_LINEAR_ACCELERATION = 100

# The absolute encoders keep the true position across ordinary power cycles, so
# LinuxCNC doesn't need a fresh homing confirmation every session -- trust whatever
# position the drives report at boot. The rare index-pulse homing trigger below is
# only for re-referencing after a battery swap or an axis coming apart.
NO_FORCE_HOMING = 1

[KINS]
KINEMATICS = trivkins
JOINTS = 3

# Axes sections ---------------
[AXIS_X]
MAX_VELOCITY = 3.0
MAX_ACCELERATION = 4.0
MIN_LIMIT = 0.0
MAX_LIMIT = 11.5

[AXIS_Y]
MAX_VELOCITY = 3.0
MAX_ACCELERATION = 4.0
MIN_LIMIT = 0.0
MAX_LIMIT = 9.50

[AXIS_Z]
MAX_VELOCITY = 2.0
MAX_ACCELERATION = 3.0
MIN_LIMIT = -7.5
MAX_LIMIT = 0.0

# Joints sections -------------
[JOINT_0]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 3
MAX_ACCELERATION = 4.0
BACKLASH = 0.000
FERROR = 0.100
MIN_FERROR = 0.010
MIN_LIMIT = 0.0
MAX_LIMIT = 11.5
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.2
HOME_USE_INDEX = YES
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1
HOME_IS_SHARED = 1
# Drive-side homing config (still needed regardless of trigger mechanism -- the drive's
# own 6098h/6099h/609Ah/607Ch objects, pushed in via benchman.hal). Trigger is now
# joint.0.index-enable <-> cia402.0.home (wired in benchman.hal), fired by LinuxCNC's
# own stock index-pulse homing path: `halcmd setp halui.joint.0.home 1` or the AXIS
# Home button. Harmless day-to-day since NO_FORCE_HOMING means it's never required --
# only use it after a battery swap or reassembling this axis.
# Homes to the negative-limit switch, no Z-pulse search: method 17. Method 1 (Z-pulse
# search) never reported completion on this drive/absolute-encoder combo -- statusword
# bits 12/15 stayed 0 through several internal retries with fault-code staying 0 the
# whole time, so the drive was silently giving up rather than faulting or finishing.
# CIA402_HOME_OFFSET_COUNTS is the raw encoder count (607C) the drive reports once homing is complete
CIA402_HOMING_METHOD = 17
CIA402_HOMING_SEARCH_VELOCITY = 320000
CIA402_HOMING_LATCH_VELOCITY = 20000
CIA402_HOMING_ACCELERATION = 700000
CIA402_HOME_OFFSET_COUNTS = 0

[JOINT_1]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 1.333
MAX_ACCELERATION = 3.0
BACKLASH = 0.000
FERROR = 0.100
MIN_FERROR = 0.010
MIN_LIMIT = 0.0
MAX_LIMIT = 9.5
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.2
HOME_USE_INDEX = YES
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1
# Method 17 (negative limit, no Z-pulse) -- see the note on [JOINT_0] about why
# Z-pulse-search methods (was 2) aren't completing reliably on this drive.
CIA402_HOMING_METHOD = 17
CIA402_HOMING_SEARCH_VELOCITY = 320000
CIA402_HOMING_LATCH_VELOCITY = 20000
CIA402_HOMING_ACCELERATION = 700000
CIA402_HOME_OFFSET_COUNTS = 0

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 1.333
MAX_ACCELERATION = 1.0
BACKLASH = 0.000
MIN_LIMIT = -8.0
MAX_LIMIT = 0.0
FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.2
HOME_USE_INDEX = YES
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 0
HOME_IS_SHARED = 1
# Z homes to its positive-limit switch (fully retracted/up), method 18, no Z-pulse
# (this was drifted to 2, a Z-pulse method -- see the note on [JOINT_0]).
# Home offset is 0 counts so machine Z0 is true top-of-travel (see MAX_LIMIT note above).
CIA402_HOMING_METHOD = 18
CIA402_HOMING_SEARCH_VELOCITY = 320000
CIA402_HOMING_LATCH_VELOCITY = 20000
CIA402_HOMING_ACCELERATION = 700000
CIA402_HOME_OFFSET_COUNTS = 0
